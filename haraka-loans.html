<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Authentication Pipeline</title>
  <!-- Native Bootstrap 6 Alpha 1 Layout Stylesheet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: var(--bs-bg-2);
      min-height: 100dvh;
    }
    .auth-card {
      max-width: 440px;
      width: 100%;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-4">

  <div class="card auth-card shadow-lg">
    <!-- Component Header -->
    <div class="card-header text-center py-4 bg-1 border-bottom">
      <h1 class="h3 fw-bold mb-1">Verify Your Identity</h1>
      <p class="text-sm fg-3 mb-0">Secure Verification Pipeline</p>
    </div>

    <!-- Main Dynamic Layout Container -->
    <div class="card-body p-5">
      <form id="authPipelineForm" autocomplete="off" novalidate>
        
        <!-- Step 1: Input Control with Inline Adornment Icons -->
        <div class="form-field mb-4">
          <label for="userCredential" class="form-label">Account Identifier</label>
          <div class="form-control form-adorn">
            <span class="form-adorn-icon">
              <svg xmlns="http://w3.org" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4">
                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
              </svg>
            </span>
            <input type="text" id="userCredential" class="form-ghost" placeholder="Enter username or mobile token" required>
          </div>
          <div class="invalid-feedback">Please enter a valid account token.</div>
        </div>

        <!-- Step 2: Native OTP Multi-Slot Container Component -->
        <div class="form-group mb-4 text-center justify-items-center">
          <label class="form-label d-block text-start w-100">One-Time Security Token</label>
          
          <!-- Core OtpInput Component API Layout Structure -->
          <div class="otp otp-lg" data-bs-otp id="securityTokenContainer">
            <input type="text" class="otp-input" id="otpRawInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code">
            <div class="otp-slots" aria-hidden="true">
              <!-- JS Initialization will explicitly generate interactive targets inside this container slot -->
            </div>
          </div>
          
          <div class="form-text text-start mt-2">Enter the verification parameter transmitted to your node.</div>
        </div>

        <!-- Step 3: Password Field backed by Native Strength Scorer Class -->
        <div class="form-field mb-4">
          <label for="secureKey" class="form-label">System Security Key</label>
          <input type="password" id="secureKey" class="form-control" placeholder="Input passphrase" required>
          
          <!-- Native Strength Meter Segment Bar Node Integration -->
          <div class="strength mt-2" data-bs-strength id="passphraseStrengthBar">
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
          </div>
          <span class="strength-text"></span>
        </div>

        <!-- Action Layout Area -->
        <button type="submit" class="btn btn-solid theme-primary w-100 fw-semibold py-2">
          Execute Verification
        </button>
      </form>
    </div>

    <!-- Component Footer Information -->
    <div class="card-footer bg-1 text-center py-3 text-xs fg-4 border-top">
      Protected by End-to-End Cryptographic Validation Protocols.
    </div>
  </div>

  <!-- Framework ESM JavaScript Driver Hook Initialization -->
  <script type="module">
    import { OtpInput, Strength } from 'https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js';

    // 1. Initialize Token Slot Components 
    const otpContainer = document.getElementById('securityTokenContainer');
    if (otpContainer) {
      OtpInput.getOrCreateInstance(otpContainer, {
        type: 'numeric',
        length: 6,
        groups:, // Splitting layout configuration directly into segments
        separator: '·'
      });
    }

    // 2. Attach Interactive Scoring Evaluator Class to Passphrase Input Element
    const strengthBar = document.getElementById('passphraseStrengthBar');
    if (strengthBar) {
      Strength.getOrCreateInstance(strengthBar, {
        input: '#secureKey',
        minLength: 8,
        messages: {
          weak: 'Key Strength: Low / Vulnerable',
          fair: 'Key Strength: Medium / Acceptable',
          good: 'Key Strength: Optimal',
          strong: 'Key Strength: Enterprise Grade High'
        }
      });
    }

    // 3. Prevent Form Submissions if Rules Fall Short of Validity Bounds
    const formNode = document.getElementById('authPipelineForm');
    formNode.addEventListener('submit', (e) => {
      e.preventDefault();
      const inputVal = document.getElementById('otpRawInput').value;
      
      if (!formNode.checkValidity() || inputVal.length < 6) {
        formNode.classList.add('is-invalid');
        alert('Validation Check Failed: Ensure all security token inputs match structural configurations.');
      } else {
        formNode.classList.remove('is-invalid');
        formNode.classList.add('is-valid');
        alert('Validation Check Succeeded: Initializing secure credential pipeline payload.');
      }
    });
  </script>
</body>
</html>
